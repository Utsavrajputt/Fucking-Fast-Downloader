name: Android build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build unsigned release APK
        shell: bash
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Sign release APKs
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$apksigner"

          mkdir -p app/build/outputs/apk/signed

          # Each flavor (lite = no YouTube, full = adds yt-dlp) splits into
          # its own arm64-v8a and armeabi-v7a APK -- 4 total. Each contains
          # only its own ABI's native libs (yt-dlp/ffmpeg/python for full,
          # libtorrent4j for both) -- never both ABIs' worth in one file.
          declare -A wanted=(
            [Xmd-lite-arm64-v8a]="app/build/outputs/apk/lite/release/*arm64-v8a*-unsigned.apk"
            [Xmd-lite-armeabi-v7a]="app/build/outputs/apk/lite/release/*armeabi-v7a*-unsigned.apk"
            [Xmd-full-arm64-v8a]="app/build/outputs/apk/full/release/*arm64-v8a*-unsigned.apk"
            [Xmd-full-armeabi-v7a]="app/build/outputs/apk/full/release/*armeabi-v7a*-unsigned.apk"
          )

          for label in "${!wanted[@]}"; do
            unsigned=$(compgen -G "${wanted[$label]}" | head -n1 || true)
            if [[ -z "$unsigned" ]]; then
              echo "Missing expected unsigned APK for $label (pattern: ${wanted[$label]})"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
              echo "KEYSTORE_BASE64 is not set (expected for fork PRs); leaving $label unsigned."
              cp "$unsigned" "app/build/outputs/apk/signed/$label-unsigned.apk"
              continue
            fi

            if [[ -z "${{ secrets.KEY_ALIAS }}" || -z "${{ secrets.KEYSTORE_PASSWORD }}" || -z "${{ secrets.KEY_PASSWORD }}" ]]; then
              echo "KEYSTORE_BASE64 is set but KEY_ALIAS / KEYSTORE_PASSWORD / KEY_PASSWORD are missing."
              exit 1
            fi

            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

            "$apksigner" sign \
              --ks release.jks \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "app/build/outputs/apk/signed/$label.apk" \
              "$unsigned"
            rm -f release.jks
          done

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          shopt -s nullglob
          signed=(app/build/outputs/apk/signed/*.apk)
          if [[ ${#signed[@]} -eq 0 ]]; then
            echo "No signed APKs found -- skipping verification (unsigned build)."
          else
            for apk in "${signed[@]}"; do
              [[ "$apk" == *-unsigned.apk ]] && continue
              "$apksigner" verify --verbose --print-certs "$apk"
            done
          fi

      - name: Upload Xmd-lite-arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: Xmd-lite-arm64-v8a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/Xmd-lite-arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xmd-lite-armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: Xmd-lite-armeabi-v7a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/Xmd-lite-armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xmd-full-arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: Xmd-full-arm64-v8a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/Xmd-full-arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xmd-full-armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: Xmd-full-armeabi-v7a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/Xmd-full-armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14
