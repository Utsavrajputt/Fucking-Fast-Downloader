name: Make pre-release

on:
  push:
    tags:
      # e.g. v1.1.0-beta.1, v1.1.0-rc.2, v2.0.0-alpha
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Pre-release tag (for example v1.1.0-beta.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prerelease-for-github:
    name: Pre-release for GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve and validate pre-release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version_tag="${GITHUB_REF#refs/tags/}"
          else
            version_tag="${{ inputs.tag_name }}"
          fi

          if [[ ! "$version_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$ ]]; then
            echo "Invalid pre-release tag: $version_tag (expected vX.Y.Z-suffix, e.g. v1.1.0-beta.1)"
            exit 1
          fi
          echo "VERSION_TAG=$version_tag" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build unsigned release APK
        shell: bash
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" || -z "${{ secrets.KEY_ALIAS }}" || -z "${{ secrets.KEYSTORE_PASSWORD }}" || -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "Pre-releases require all signing secrets."
            exit 1
          fi
          test -x "$apksigner"

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          trap 'rm -f release.jks' EXIT

          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/app-release.apk"

          if [[ ! -f "$unsigned" ]]; then
            echo "Missing expected unsigned APK: $unsigned"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          "$apksigner" sign \
            --ks release.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$signed" \
            "$unsigned"
          "$apksigner" verify --verbose "$signed"
          rm -f "$unsigned"

      - name: Stage release asset and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          : > checksums.txt

          src="app/build/outputs/apk/release/app-release.apk"
          dst="release-assets/Xmd-${VERSION_TAG}.apk"
          test -f "$src"
          cp "$src" "$dst"
          sha256sum "$dst" | tee -a checksums.txt

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version_tag = os.environ['VERSION_TAG']
          # Strip the leading "v" and any pre-release suffix (-beta.1, -rc.2, ...)
          # so "v1.1.0-beta.1" can match a CHANGELOG heading like "## [1.1.0]".
          base_version = version_tag.lstrip('v').split('-', 1)[0]

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()

          def section_for(heading_pattern):
              regex = re.compile(heading_pattern)
              section, in_section = [], False
              for line in changelog:
                  if line.startswith('## '):
                      if in_section:
                          break
                      in_section = bool(regex.search(line))
                  if in_section:
                      section.append(line)
              return '\n'.join(section).strip()

          # Prefer an exact version match, then an [Unreleased] section, then
          # fall back to whatever the top-most changelog section is -- a
          # pre-release build should never fail just because the changelog
          # hasn't been given a matching heading yet.
          notes = (
              section_for(re.escape(f'[{base_version}]'))
              or section_for(r'\[Unreleased\]')
              or section_for(r'^## ')
          )
          if not notes:
              notes = f'## {version_tag}\n\nPre-release build. See commit history for details.'

          Path('release-notes.md').write_text(
              notes + '\n\n---\n' +
              '⚠️ **This is a pre-release build** — it may be unstable and is not recommended for general use.\n\n' +
              '### SHA-256 checksum\n\n```text\n',
              encoding='utf-8',
          )
          PY
          cat checksums.txt >> release-notes.md
          printf '%s\n' '```' >> release-notes.md

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Xmd ${{ env.VERSION_TAG }} (Pre-release)
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
